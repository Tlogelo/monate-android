name: Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch cancels the older run
concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licences
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      - name: Make gradlew executable
        run: chmod +x gradlew

      # Automated testing: password hashing, validators, login/register/Google sign-in rules,
      # orders, loyalty, support and the "10+ records per table" database check.
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Show test results in the run summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          total = failed = skipped = 0
          rows = []
          for f in sorted(glob.glob("app/build/test-results/testDebugUnitTest/*.xml")):
              s = ET.parse(f).getroot()
              t, fl, e, sk = (int(s.get(k, 0)) for k in ("tests", "failures", "errors", "skipped"))
              total += t; failed += fl + e; skipped += sk
              rows.append((s.get("name"), t, fl + e, sk))
          out = ["## Unit test results", "",
                 f"**{total} tests, {failed} failed, {skipped} skipped**", "",
                 "| Test class | Tests | Failed | Skipped |", "|---|---:|---:|---:|"]
          out += [f"| {n} | {t} | {fl} | {sk} |" for n, t, fl, sk in rows]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(out) + "\n")
          PY

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest/

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: monate-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
